name: Build PHP binaries

on:
  workflow_call:
    inputs:
      pm-version-major:
        description: "PocketMine-MP major version"
        required: true
        type: number
      php-version-base:
        description: "PHP base version"
        required: true
        type: string
      special-release:
        description: "Special release type to create (pm-default-latest, pm-default, none)"
        required: true
        type: string
      pm-preview:
        description: "Mark releases as pre-release"
        required: true
        type: boolean

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            target: linux64
          - arch: arm64
            runner: ubuntu-22.04-arm
            target: linux-arm64

    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            make autoconf automake libtool libtool-bin m4 wget \
            libc-bin gzip bzip2 xz-utils bison g++ git cmake \
            pkg-config re2c ca-certificates file

      - name: Cache source downloads
        uses: actions/cache@v6
        with:
          path: ./download_cache
          key: compile-sh-downloads-${{ hashFiles('./compile.sh') }}
          restore-keys: compile-sh-downloads-

      - name: Compile PHP
        run: |
          set -euxo pipefail
          ./compile.sh \
            -t "${{ matrix.target }}" \
            -j "$(nproc)" \
            -g \
            -P "${{ inputs.pm-version-major }}" \
            -c ./download_cache \
            -z "${{ inputs.php-version-base }}"

      - name: Validate and package
        run: |
          set -euo pipefail

          NORMAL_ARCHIVE="PHP-${{ inputs.php-version-base }}-Linux-${{ matrix.arch }}-PM${{ inputs.pm-version-major }}.tar.gz"
          HOSTING_ARCHIVE="PHP-${{ inputs.php-version-base }}-Linux-${{ matrix.arch }}-PM${{ inputs.pm-version-major }}-hosting.tar.gz"
          PHP_BINARY="bin/php7/bin/php"

          if [ ! -x "$PHP_BINARY" ]; then
            echo "::error::$PHP_BINARY is missing or not executable"
            exit 1
          fi

          PHP_FILE_INFO="$(file "$PHP_BINARY")"
          echo "$PHP_FILE_INFO"

          case "${{ matrix.arch }}" in
            x86_64)
              echo "$PHP_FILE_INFO" | grep -q "x86-64" || {
                echo "::error::Expected an x86_64 PHP binary"
                exit 1
              }
              ;;
            arm64)
              echo "$PHP_FILE_INFO" | grep -Eq "ARM aarch64|aarch64" || {
                echo "::error::Expected an ARM64/AArch64 PHP binary"
                exit 1
              }
              ;;
          esac

          "$PHP_BINARY" -v

          # Standard Linux archive: preserves Unix symbolic links.
          tar -czf "$NORMAL_ARCHIVE" bin

          # Hosting-safe archive: dereference symlinks so panels/upload tools
          # cannot turn shared-library symlinks into broken tiny files.
          rm -rf hosting-root
          mkdir -p hosting-root
          cp -aL bin hosting-root/bin

          if find hosting-root/bin -type l -print -quit | grep -q .; then
            echo "::error::Hosting archive still contains symbolic links"
            find hosting-root/bin -type l -ls
            exit 1
          fi

          HOSTING_PHP="hosting-root/bin/php7/bin/php"
          HOSTING_FILE_INFO="$(file "$HOSTING_PHP")"
          echo "$HOSTING_FILE_INFO"

          case "${{ matrix.arch }}" in
            x86_64)
              echo "$HOSTING_FILE_INFO" | grep -q "x86-64" || {
                echo "::error::Hosting PHP binary is not x86_64"
                exit 1
              }
              ;;
            arm64)
              echo "$HOSTING_FILE_INFO" | grep -Eq "ARM aarch64|aarch64" || {
                echo "::error::Hosting PHP binary is not ARM64/AArch64"
                exit 1
              }
              ;;
          esac

          "$HOSTING_PHP" -v
          tar -C hosting-root -czf "$HOSTING_ARCHIVE" bin

          echo "Created:"
          ls -lh "$NORMAL_ARCHIVE" "$HOSTING_ARCHIVE"

      - name: Upload Linux binaries
        uses: actions/upload-artifact@v7
        with:
          name: PHP-${{ inputs.php-version-base }}-Linux-${{ matrix.arch }}-PM${{ inputs.pm-version-major }}
          path: |
            ./PHP-${{ inputs.php-version-base }}-Linux-${{ matrix.arch }}-PM${{ inputs.pm-version-major }}.tar.gz
            ./PHP-${{ inputs.php-version-base }}-Linux-${{ matrix.arch }}-PM${{ inputs.pm-version-major }}-hosting.tar.gz
          if-no-files-found: error

  macos:
    name: MacOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mac-x86-64
            arch: x86_64
            runner: macos-15-intel
          - target: mac-arm64
            arch: arm64
            runner: macos-15

    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          brew uninstall --ignore-dependencies --force pkg-config@0.29.2 || true
          brew install libtool autoconf automake pkg-config bison re2c

      - name: Cache source downloads
        uses: actions/cache@v6
        with:
          path: ./download_cache
          key: compile-sh-downloads-${{ hashFiles('./compile.sh') }}
          restore-keys: compile-sh-downloads-

      - name: Compile PHP
        run: |
          export PATH="/usr/local/opt/bison/bin:/opt/homebrew/opt/bison/bin:$PATH"
          set -euxo pipefail
          ./compile.sh \
            -t "${{ matrix.target }}" \
            -j 4 \
            -g \
            -P "${{ inputs.pm-version-major }}" \
            -c ./download_cache \
            -z "${{ inputs.php-version-base }}"

      - name: Package
        run: |
          tar -czf "PHP-${{ inputs.php-version-base }}-MacOS-${{ matrix.arch }}-PM${{ inputs.pm-version-major }}.tar.gz" bin

      - name: Upload MacOS binary
        uses: actions/upload-artifact@v7
        with:
          name: PHP-${{ inputs.php-version-base }}-MacOS-${{ matrix.arch }}-PM${{ inputs.pm-version-major }}
          path: ./PHP-${{ inputs.php-version-base }}-MacOS-${{ matrix.arch }}-PM${{ inputs.pm-version-major }}.tar.gz
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v7

      - name: Cache source downloads
        uses: actions/cache@v6
        with:
          path: ./download_cache
          key: windows-downloads-${{ hashFiles('./windows-compile-vs.ps1') }}
          restore-keys: windows-downloads-

      - name: Compile PHP
        run: .\windows-compile-vs.ps1
        env:
          SOURCES_PATH: ${{ github.workspace }}\pocketmine-php-sdk
          PM_VERSION_MAJOR: ${{ inputs.pm-version-major }}
          PHP_VERSION_BASE: ${{ inputs.php-version-base }}

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive `
            -Path .\bin `
            -DestinationPath "PHP-${{ inputs.php-version-base }}-Windows-x64-PM${{ inputs.pm-version-major }}.zip"

      - name: Upload Windows binary
        uses: actions/upload-artifact@v7
        with:
          name: PHP-${{ inputs.php-version-base }}-Windows-x64-PM${{ inputs.pm-version-major }}
          path: ./PHP-${{ inputs.php-version-base }}-Windows-x64-PM${{ inputs.pm-version-major }}.zip
          if-no-files-found: error

  publish:
    name: Publish binaries
    needs: [linux, macos, windows]
    runs-on: ubuntu-22.04
    if: ${{ github.ref_name == 'stable' && github.ref_type == 'branch' && !contains(github.event.head_commit.message, '[no release]') }}
    concurrency: release-${{ inputs.php-version-base }}-pm${{ inputs.pm-version-major }}

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Update latest tags
        run: |
          git tag -f "pm${{ inputs.pm-version-major }}-php-${{ inputs.php-version-base }}-latest"
          git push -f origin "pm${{ inputs.pm-version-major }}-php-${{ inputs.php-version-base }}-latest"
          git tag -f "pm${{ inputs.pm-version-major }}-latest"
          git push -f origin "pm${{ inputs.pm-version-major }}-latest"

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: ${{ github.workspace }}
          pattern: "*PHP-${{ inputs.php-version-base }}-*-PM${{ inputs.pm-version-major }}"

      - name: Generate release notes
        run: |
          {
            echo "### PHP ${{ inputs.php-version-base }} for PocketMine-MP ${{ inputs.pm-version-major }}.x"
            echo
            echo "Last updated on **$(date -u +'%d %b %Y at %H:%M:%S %Z')**"
            echo
            echo "Built by: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "Build number: ${{ github.run_number }}"
            echo
            echo ':information_source: **Linux users**: Choose `x86_64` or `arm64` based on the CPU architecture of the server that will run PHP, not the phone/PC used to upload the files.'
            echo ':package: **Game hosting / panel users**: Use the matching `-hosting.tar.gz` Linux build if your host/file manager does not preserve Unix symbolic links.'
            echo ":information_source: **Linux/MacOS users**: See [this page](https://doc.pmmp.io/en/rtfd/faq/installation/opcache.so.html) for extension loading errors."
            echo ":warning: **Windows users**: Install [Visual C++ Redistributable](https://aka.ms/vs/17/release/vc_redist.x64.exe) or the binary will not work."
            echo
          } > changelog.md

          if [[ "${{ inputs.special-release }}" != "none" ]]; then
            echo ":white_check_mark: At the time of publication, this version is recommended for PocketMine-MP ${{ inputs.pm-version-major }}.x production servers." >> changelog.md
          else
            echo ":warning: At the time of publication, plugins for PocketMine-MP ${{ inputs.pm-version-major }}.x may not work with this PHP version." >> changelog.md
            echo "If you have problems, try the [recommended PM${{ inputs.pm-version-major }} release](${{ github.server_url }}/${{ github.repository }}/releases/pm${{ inputs.pm-version-major }}-latest)." >> changelog.md
          fi

      - name: Get date
        id: date
        run: echo "DATE=$(date -u +'%d %b %Y')" >> "$GITHUB_OUTPUT"

      - name: Update recommended PM release
        uses: ncipollo/release-action@v1.21.0
        if: ${{ inputs.special-release != 'none' }}
        with:
          artifacts: |
            ${{ github.workspace }}/*PHP-*-PM*/*.tar.gz
            ${{ github.workspace }}/*PHP-*-Windows-*-PM*/*.zip
          name: PM ${{ inputs.pm-version-major }}.x (${{ steps.date.outputs.DATE }}) - Recommended
          tag: pm${{ inputs.pm-version-major }}-latest
          commit: ${{ github.sha }}
          allowUpdates: true
          removeArtifacts: true
          bodyFile: ${{ github.workspace }}/changelog.md
          makeLatest: ${{ inputs.special-release == 'default-latest' }}
          prerelease: ${{ inputs.pm-preview == true }}

      - name: Update PHP-version PM release
        uses: ncipollo/release-action@v1.21.0
        with:
          artifacts: |
            ${{ github.workspace }}/*PHP-*-PM*/*.tar.gz
            ${{ github.workspace }}/*PHP-*-Windows-*-PM*/*.zip
          name: PM ${{ inputs.pm-version-major }}.x (${{ steps.date.outputs.DATE }}) - PHP ${{ inputs.php-version-base }}
          tag: pm${{ inputs.pm-version-major }}-php-${{ inputs.php-version-base }}-latest
          commit: ${{ github.sha }}
          allowUpdates: true
          removeArtifacts: true
          bodyFile: ${{ github.workspace }}/changelog.md
          makeLatest: false
          prerelease: ${{ inputs.pm-preview == true }}
