name: Build Quark PHP binaries

on:
  workflow_call:
    inputs:
      pm-version-major:
        description: "Legacy PM build target (5 for Quark v6)"
        required: true
        type: number
      php-version-base:
        description: "PHP base version"
        required: true
        type: string
      special-release:
        description: "Special release type to create (pm-default-latest, pm-default, none)"
        required: true
        type: string
      pm-preview:
        description: "Mark releases as pre-release"
        required: true
        type: boolean

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            target: linux64

    steps:
      - uses: actions/checkout@v7

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.17.0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            make autoconf automake libtool libtool-bin m4 wget \
            libc-bin gzip bzip2 xz-utils bison g++ git cmake \
            pkg-config re2c ca-certificates file python3 patchelf

      - name: Cache source downloads
        uses: actions/cache@v6
        with:
          path: ./download_cache
          key: ${{ runner.os }}-sources-${{ hashFiles('versions.env', 'sources.sha256') }}
          restore-keys: ${{ runner.os }}-sources-

      - name: Verify build input failures
        run: |
          bash tests/build-inputs.sh
          python3 tests/package-validation.py

      - name: Compile PHP
        run: |
          set -euxo pipefail
          ./compile.sh \
            -t "${{ matrix.target }}" \
            -j "$(nproc)" \
            -D \
            -g \
            -P "${{ inputs.pm-version-major }}" \
            -c ./download_cache \
            -z "${{ inputs.php-version-base }}"

      - name: Validate and package
        timeout-minutes: 10
        run: |
          set -euo pipefail
          source versions.env

          NORMAL_ARCHIVE="PHP-${{ inputs.php-version-base }}-Linux-${{ matrix.arch }}-PM${{ inputs.pm-version-major }}.tar.gz"
          HOSTING_ARCHIVE="PHP-${{ inputs.php-version-base }}-Linux-${{ matrix.arch }}-PM${{ inputs.pm-version-major }}-hosting.tar.gz"
          PHP_BINARY="bin/php7/bin/php"

          if [ ! -x "$PHP_BINARY" ]; then
            echo "::error::$PHP_BINARY is missing or not executable"
            exit 1
          fi
          test "$("$PHP_BINARY" -r 'echo PHP_VERSION;')" = "$PHP_VERSION"

          PHP_FILE_INFO="$(file bin/php7/bin/php.bin)"
          echo "$PHP_FILE_INFO"

          case "${{ matrix.arch }}" in
            x86_64)
              echo "$PHP_FILE_INFO" | grep -q "x86-64" || {
                echo "::error::Expected an x86_64 PHP binary"
                exit 1
              }
              ;;
            arm64)
              echo "$PHP_FILE_INFO" | grep -Eq "ARM aarch64|aarch64" || {
                echo "::error::Expected an ARM64/AArch64 PHP binary"
                exit 1
              }
              ;;
          esac

          if ldd bin/php7/bin/php.bin | grep -q 'not found'; then
            echo "::error::PHP has missing shared libraries"
            ldd bin/php7/bin/php.bin
            exit 1
          fi

          bash tests/test.sh generic "$PHP_BINARY"
          USE_ZEND_ALLOC=0 MALLOC_CHECK_=3 MALLOC_PERTURB_=165 bash tests/test.sh generic "$PHP_BINARY"

          # Standard Linux archive: preserves Unix symbolic links.
          tar -czf "$NORMAL_ARCHIVE" bin

          # Hosting-safe archive: dereference symlinks so panels/upload tools
          # cannot turn shared-library symlinks into broken tiny files.
          rm -rf hosting-root
          mkdir -p hosting-root
          cp -aL bin hosting-root/bin

          if find hosting-root/bin -type l -print -quit | grep -q .; then
            echo "::error::Hosting archive still contains symbolic links"
            find hosting-root/bin -type l -ls
            exit 1
          fi

          HOSTING_PHP="hosting-root/bin/php7/bin/php"
          HOSTING_FILE_INFO="$(file hosting-root/bin/php7/bin/php.bin)"
          echo "$HOSTING_FILE_INFO"

          case "${{ matrix.arch }}" in
            x86_64)
              echo "$HOSTING_FILE_INFO" | grep -q "x86-64" || {
                echo "::error::Hosting PHP binary is not x86_64"
                exit 1
              }
              ;;
            arm64)
              echo "$HOSTING_FILE_INFO" | grep -Eq "ARM aarch64|aarch64" || {
                echo "::error::Hosting PHP binary is not ARM64/AArch64"
                exit 1
              }
              ;;
          esac

          tar -C hosting-root -czf "$HOSTING_ARCHIVE" bin
          python3 tests/validate-package.py "$NORMAL_ARCHIVE" "$HOSTING_ARCHIVE"

          mkdir -p package-check/normal package-check/hosting
          tar -xzf "$NORMAL_ARCHIVE" -C package-check/normal
          tar -xzf "$HOSTING_ARCHIVE" -C package-check/hosting
          for root in package-check/normal package-check/hosting; do
            python3 tests/check-libraries.py "$root/bin/php7"
            while IFS= read -r -d '' library; do
              links="$(ldd "$library")"
              if grep 'not found' <<< "$links"; then
                echo "::error::$library has missing shared libraries"
                exit 1
              fi
            done < <(find "$root/bin" -type f \( -name php.bin -o -name '*.so' -o -name '*.so.*' \) -print0)
            timeout 60 "$root/bin/php7/bin/php" tests/generic/native.php
            for attempt in 1 2 3 4 5; do
              bash tests/test.sh generic "$root/bin/php7/bin/php"
            done
          done

          OPCACHE="$(find bin/php7/lib/php/extensions -name opcache.so -print -quit)"
          timeout 30s "$PHP_BINARY" -c bin/php7/bin/php.ini -d "extension_dir=$(dirname "$OPCACHE")" benchmarks/baseline.php > benchmark.json

          tar -czf "Quark-PHP-${PHP_VERSION}-linux-${{ matrix.arch }}-symbols.tar.gz" bin-debug

          echo "Created:"
          ls -lh "$NORMAL_ARCHIVE" "$HOSTING_ARCHIVE"

      - name: Upload Linux binaries
        uses: actions/upload-artifact@v7
        with:
          name: PHP-${{ inputs.php-version-base }}-Linux-${{ matrix.arch }}-PM${{ inputs.pm-version-major }}
          path: |
            ./PHP-${{ inputs.php-version-base }}-Linux-${{ matrix.arch }}-PM${{ inputs.pm-version-major }}.tar.gz
            ./PHP-${{ inputs.php-version-base }}-Linux-${{ matrix.arch }}-PM${{ inputs.pm-version-major }}-hosting.tar.gz
            ./Quark-PHP-*-linux-${{ matrix.arch }}-symbols.tar.gz
            ./benchmark.json
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-2022
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.17.0

      - name: Cache source downloads
        uses: actions/cache@v6
        with:
          path: ./download_cache
          key: ${{ runner.os }}-sources-${{ hashFiles('versions.env', 'sources.sha256', 'windows-deps.sha256') }}
          restore-keys: ${{ runner.os }}-sources-

      - name: Compile PHP
        run: .\windows-compile-vs.ps1
        env:
          SOURCES_PATH: ${{ github.workspace }}\pocketmine-php-sdk
          PM_VERSION_MAJOR: ${{ inputs.pm-version-major }}
          PHP_VERSION_BASE: ${{ inputs.php-version-base }}

      - name: Validate and package
        timeout-minutes: 10
        shell: pwsh
        run: |
          $php = (Resolve-Path .\bin\php\php.exe).Path
          $expected = ((Get-Content .\versions.env | Select-String '^PHP_VERSION=').ToString().Split('='))[1]
          if ((& $php -r 'echo PHP_VERSION;') -ne $expected) { throw "Unexpected PHP version" }
          if ((& $php -r 'echo php_uname("m");') -notmatch 'AMD64|x86_64') { throw "Expected Windows x64 PHP" }
          & $php -c .\bin\php\php.ini .\tests\generic\smoke.php
          if ($LASTEXITCODE -ne 0) { throw "PHP smoke tests failed" }
          & $php -c .\bin\php\php.ini -d "extension_dir=$PWD/bin/php/ext" .\tests\generic\native.php
          if ($LASTEXITCODE -ne 0) { throw "Native runtime tests failed" }
          $env:USE_ZEND_ALLOC = '0'
          & $php -c .\bin\php\php.ini .\tests\generic\smoke.php
          if ($LASTEXITCODE -ne 0) { throw "PHP allocator smoke tests failed" }
          Remove-Item Env:USE_ZEND_ALLOC

          & $php -c .\bin\php\php.ini .\benchmarks\baseline.php > benchmark.json
          if ($LASTEXITCODE -ne 0) { throw "PHP benchmarks failed" }

          $symbols = @(Get-ChildItem -LiteralPath . -Filter 'php-debug-pack-*.zip')
          if ($symbols.Count -ne 1) { throw "Expected one Windows debug pack" }
          Copy-Item -LiteralPath $symbols[0].FullName -Destination "Quark-PHP-$expected-windows-x64-symbols.zip"

          Compress-Archive `
            -Path .\bin `
            -DestinationPath "PHP-${{ inputs.php-version-base }}-Windows-x64-PM${{ inputs.pm-version-major }}.zip"

          python tests/validate-package.py "PHP-${{ inputs.php-version-base }}-Windows-x64-PM${{ inputs.pm-version-major }}.zip"
          if ($LASTEXITCODE -ne 0) { throw "Native package files are missing" }

          Expand-Archive `
            -Path "PHP-${{ inputs.php-version-base }}-Windows-x64-PM${{ inputs.pm-version-major }}.zip" `
            -DestinationPath .\package-check
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot;$PWD/package-check/bin/php"
          1..5 | ForEach-Object {
            & .\package-check\bin\php\php.exe -c .\package-check\bin\php\php.ini -d "extension_dir=$PWD/package-check/bin/php/ext" .\tests\generic\native.php
            if ($LASTEXITCODE -ne 0) { throw "Packaged native runtime failed" }
            & .\package-check\bin\php\php.exe -c .\package-check\bin\php\php.ini -d "extension_dir=$PWD/package-check/bin/php/ext" .\tests\generic\smoke.php
            if ($LASTEXITCODE -ne 0) { throw "Packaged PHP thread stress failed on iteration $_" }
          }

      - name: Upload Windows binary
        uses: actions/upload-artifact@v7
        with:
          name: PHP-${{ inputs.php-version-base }}-Windows-x64-PM${{ inputs.pm-version-major }}
          path: |
            ./PHP-${{ inputs.php-version-base }}-Windows-x64-PM${{ inputs.pm-version-major }}.zip
            ./Quark-PHP-*-windows-x64-symbols.zip
            ./benchmark.json
          if-no-files-found: error

  publish:
    name: Publish Quark binaries
    needs: [linux, windows]
    runs-on: ubuntu-22.04
    if: ${{ github.ref_name == 'stable' && github.ref_type == 'branch' && !contains(github.event.head_commit.message, '[no release]') }}
    concurrency: release-${{ inputs.php-version-base }}-pm${{ inputs.pm-version-major }}

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: ${{ github.workspace }}
          pattern: "*PHP-${{ inputs.php-version-base }}-*-PM${{ inputs.pm-version-major }}"

      - name: Verify release assets and write checksums
        run: bash tests/prepare-release.sh "${{ inputs.pm-version-major }}"

      - name: Generate release notes
        run: |
          {
            source versions.env
            echo "### Quark v6 PHP $PHP_VERSION ZTS"
            echo
            echo "Last updated on **$(date -u +'%d %b %Y at %H:%M:%S %Z')**"
            echo
            echo "Built by: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "Source: ${{ github.sha }}"
            echo "qthreads: $EXT_QTHREADS_COMMIT"
            echo
            echo ':information_source: **Linux users**: Native packages currently target Linux x86_64 and Windows x64.'
            echo ':package: **Game hosting / panel users**: Use the matching `-hosting.tar.gz` Linux build if your host/file manager does not preserve Unix symbolic links.'
            echo ":warning: **Windows users**: Required MSVC runtime DLLs are included beside php.exe."
            echo "SHA-256 checksums are in \`SHA256SUMS\`."
            echo
          } > changelog.md

          echo "The PM5 asset names and release tags remain for existing installers." >> changelog.md

      - name: Get date
        id: date
        run: echo "DATE=$(date -u +'%d %b %Y')" >> "$GITHUB_OUTPUT"

      - name: Update Quark release at the legacy latest tag
        uses: ncipollo/release-action@v1.21.0
        if: ${{ inputs.special-release != 'none' }}
        with:
          artifacts: ${{ github.workspace }}/release-assets/*
          name: Quark v6 PHP ${{ inputs.php-version-base }} (${{ steps.date.outputs.DATE }})
          tag: pm${{ inputs.pm-version-major }}-latest
          commit: ${{ github.sha }}
          allowUpdates: true
          removeArtifacts: true
          bodyFile: ${{ github.workspace }}/changelog.md
          makeLatest: ${{ inputs.special-release == 'default-latest' }}
          prerelease: ${{ inputs.pm-preview == true }}

      - name: Update PHP-version release at the legacy tag
        uses: ncipollo/release-action@v1.21.0
        with:
          artifacts: ${{ github.workspace }}/release-assets/*
          name: Quark v6 PHP ${{ inputs.php-version-base }} (${{ steps.date.outputs.DATE }})
          tag: pm${{ inputs.pm-version-major }}-php-${{ inputs.php-version-base }}-latest
          commit: ${{ github.sha }}
          allowUpdates: true
          removeArtifacts: true
          bodyFile: ${{ github.workspace }}/changelog.md
          makeLatest: false
          prerelease: ${{ inputs.pm-preview == true }}

      - name: Move compatibility tags after publishing
        run: |
          git tag -f "pm${{ inputs.pm-version-major }}-php-${{ inputs.php-version-base }}-latest"
          git push -f origin "pm${{ inputs.pm-version-major }}-php-${{ inputs.php-version-base }}-latest"
          git tag -f "pm${{ inputs.pm-version-major }}-latest"
          git push -f origin "pm${{ inputs.pm-version-major }}-latest"
